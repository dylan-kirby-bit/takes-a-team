<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Takes a Team">
<meta name="theme-color" content="#103a2a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Takes a Team Playbook</title>
<style>
/* A coach's chalk playbook on turf. Uses only fonts built into iPad/Mac/Windows, so the page makes no outside requests. */
:root{
  --turf:#103a2a; --turf-2:#17483a; --turf-3:#1d5644; --line:rgba(243,241,232,.14);
  --chalk:#f3f1e8; --chalk-dim:#b8c8bd; --gold:#f6bd3a; --gold-ink:#2a1f05;
  --good:#8fdc9a; --miss:#f39a7c;
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --body:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --hand:"Noteworthy","Marker Felt","Comic Sans MS","Bradley Hand",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--turf);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,transparent 0 119px,var(--line) 119px 121px);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
input,textarea{-webkit-user-select:text;user-select:text}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:14px 24px;gap:18px}
.board{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--chalk);padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem}
.brand b{color:var(--gold)}
.downs{display:flex;gap:8px;font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:.9rem;text-transform:uppercase}
.downs span{padding:4px 10px;border:1.5px solid var(--chalk-dim);color:var(--chalk-dim);border-radius:3px}
.downs span.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.downs span.done{color:var(--chalk);border-color:var(--chalk)}
main{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(3rem,9vw,6.2rem)}
h2{font-size:clamp(2rem,5vw,3.1rem)}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:1rem}
.hand{font-family:var(--hand);color:var(--chalk-dim)}
.scenario{font-size:clamp(1.25rem,2.6vw,1.6rem);max-width:46ch;margin:0;line-height:1.35}
.scenario q{font-family:var(--hand);color:var(--chalk)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.play{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:18px;border:2px solid var(--chalk);border-radius:6px;background:var(--turf-2);min-height:220px;transition:transform .15s,background .15s}
.play:active{transform:scale(.98);background:var(--turf-3)}
.play:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.play .tag{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.1em;color:var(--gold)}
.play svg{width:100%;height:76px;color:var(--chalk-dim)}
.play strong{font-family:var(--display);font-weight:800;font-size:1.7rem;text-transform:uppercase;line-height:1}
.play small{font-size:1rem;color:var(--chalk-dim);line-height:1.35}
.play.right{border-color:var(--good);background:var(--turf-3)} .play.right .tag{color:var(--good)}
.play.wrong{border-color:var(--miss);opacity:.75}
.play[disabled]{cursor:default}
.btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:1.35rem;padding:16px 30px;border-radius:4px;background:var(--gold);color:var(--gold-ink);text-align:center}
.btn:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid var(--chalk)}
.btn.warn{background:transparent;color:var(--miss);border:2px solid var(--miss)}
.btn.small{font-size:1rem;padding:10px 18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.start{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:760px){.start{grid-template-columns:1fr}}
.start h1 em{font-style:normal;color:var(--gold)}
.start svg{width:100%;max-height:340px;color:var(--chalk)}
.huddle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:h}
@media (max-width:760px){.huddle{grid-template-columns:1fr}}
.huddle div{border-top:3px solid var(--gold);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.huddle b{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;line-height:1}
.huddle b::before{counter-increment:h;content:counter(h) ". ";color:var(--gold)}
.feedback{font-size:1.25rem;max-width:52ch}
.feedback strong{font-family:var(--display);font-size:2rem;text-transform:uppercase;display:block;line-height:1}
.feedback.good strong{color:var(--good)} .feedback.miss strong{color:var(--miss)}
.final{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
@media (max-width:760px){.final{grid-template-columns:1fr}}
.qr{width:min(300px,70vw);aspect-ratio:1;max-width:100%;background:#fff;border-radius:6px;display:grid;place-items:center;padding:14px}
.qr img{width:100%;height:100%;object-fit:contain}
.qr.empty{background:transparent;border:2.5px dashed var(--chalk-dim);color:var(--chalk-dim);text-align:center;font-family:var(--hand);font-size:1.3rem}
.crisis{font-size:1.05rem;color:var(--chalk-dim);margin:0} .crisis b{color:var(--chalk)}
.staffbar{border-top:1.5px dashed var(--chalk-dim);padding-top:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.staffbar .lbl{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim);font-size:.95rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--chalk-dim);font-size:.85rem}
.hold{appearance:none;-webkit-appearance:none;background:transparent;color:var(--chalk-dim);cursor:pointer;font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:10px 14px;border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden;-webkit-touch-callout:none}
.hold i{position:absolute;inset:0;background:var(--gold);opacity:.35;transform:scaleX(0);transform-origin:left}
.hold.pressing i{transition:transform 1s linear;transform:scaleX(1)}
.panel{display:flex;flex-direction:column;gap:26px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-left:3px solid var(--chalk-dim);padding-left:12px}
.stat .n{font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.9rem;color:var(--chalk-dim)}
.stat.gold{border-color:var(--gold)} .stat.gold .n{color:var(--gold)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:.95rem}
@media (max-width:520px){.bar{grid-template-columns:96px minmax(0,1fr) 48px}}
.track{height:22px;background:var(--turf-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--chalk-dim)} .fill.post{background:var(--gold)} .fill.saved{background:var(--good)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.statement{background:var(--turf-2);border:1px solid var(--line);border-radius:4px;padding:16px;font-size:1.1rem;max-width:70ch;-webkit-user-select:text;user-select:text}
.sec h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:1.3rem;margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:6px;max-width:520px}
.field label{font-size:.9rem;color:var(--chalk-dim)}
.field input[type=text]{font:inherit;font-size:16px;color:var(--chalk);background:var(--turf-2);border:1.5px solid var(--chalk-dim);border-radius:4px;padding:10px 12px}
.field input:focus-visible{outline:2px solid var(--gold);border-color:var(--gold)}
textarea.csv{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--chalk);background:var(--turf-2);border:1px solid var(--line);border-radius:4px;padding:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--chalk-dim);font-weight:700}
.notice{border:1.5px solid var(--miss);padding:10px 14px;border-radius:4px;font-size:.95rem}
.okline{border-left:3px solid var(--good);padding-left:12px;font-size:.95rem;color:var(--chalk-dim)}
.muted{color:var(--chalk-dim)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--turf);padding:10px 18px;border-radius:4px;font-weight:600;z-index:5;max-width:calc(100% - 40px)}
[hidden]{display:none!important}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.hold.pressing i{transition:none}.play{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="board">
    <div class="brand">Mental Health <b>Takes a Team</b></div>
    <div class="downs" id="downs" aria-label="Progress"></div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div id="toast" hidden></div>

<script>
(() => {
"use strict";
/* All results stay in this browser's storage on this device. The page sends nothing anywhere. */
const KEY_PLAYS = "takesATeam.plays.v1", KEY_CFG = "takesATeam.config.v1";
const DEFAULTS = { event: "Men's Mental Health Month", where: "the Baylor University Counseling Center", qr: "", lastExport: "" };

function readKey(k, fallback){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function writeKey(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const storageOK = (() => { try { localStorage.setItem("takesATeam.test", "1"); localStorage.removeItem("takesATeam.test"); return true; } catch (e) { return false; } })();

let cfg = { ...DEFAULTS, ...readKey(KEY_CFG, {}) };
let plays = readKey(KEY_PLAYS, []);
let game = null, screen = "start", homeTimer = null, confirm = "";

function savePlays(){ if (!writeKey(KEY_PLAYS, plays)) toast("This play couldn't be saved on the iPad. Export results now."); }
function saveCfg(){ if (!writeKey(KEY_CFG, cfg)) toast("Setup couldn't be saved. The QR image may be too large."); }

const ROUND1 = {
  scenario: "Your roommate's been skipping practice, snapping at everybody, and when you ask, he says he's <q>fine.</q>",
  correct: "checkin",
  options: [
    { id: "space",   title: "Give him space", sub: "He'll come to you when he's ready.", d: "space" },
    { id: "checkin", title: "Check in directly", sub: "Ask him for real: “Hey, are you actually okay?”", d: "in" },
    { id: "joke",    title: "Crack a joke", sub: "Lighten the mood and move on.", d: "around" }
  ]
};
const ROUND2 = {
  scenario: "Your buddy says, <q>I've been in a weird place lately, but I don't want to make it a thing.</q>",
  correct: "lean",
  options: [
    { id: "change", title: "Change the subject", sub: "Keep it light so he's comfortable.", d: "away" },
    { id: "lean",   title: "Lean in and go together", sub: "“Thanks for telling me. Want to grab food and talk? I'll walk over to the Counseling Center with you.”", d: "pass" },
    { id: "shrug",  title: "Tell him it's normal", sub: "“Everybody gets stressed. You'll be fine.”", d: "space" }
  ]
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => { t.hidden = true; }, 2800); }
function fmtDate(iso){ try { return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch (e) { return iso; } }

function diagram(kind){
  const O = (x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>`;
  const X = (x,y)=>`<path d="M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}" stroke="currentColor" stroke-width="2.5" fill="none"/>`;
  const arrow = d => `<path d="${d}" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ah-${kind})"/>`;
  const defs = `<defs><marker id="ah-${kind}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>`;
  const parts = {
    space:  O(40,40)+X(200,40)+arrow("M55 52 Q 70 70 40 72"),
    in:     O(40,40)+X(200,40)+arrow("M55 40 L 180 40"),
    around: O(40,40)+X(200,40)+arrow("M52 30 Q 120 -6 188 26 Q 210 50 170 64"),
    away:   O(40,40)+X(200,40)+arrow("M55 46 Q 100 74 40 70"),
    pass:   O(40,40)+X(140,40)+`<rect x="208" y="26" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5"/>`+arrow("M55 40 L 122 40")+arrow("M156 40 L 202 40")
  };
  return `<svg viewBox="0 0 250 80" aria-hidden="true">${defs}${parts[kind]}</svg>`;
}

function downs(){
  const steps = ["Play 1", "Play 2", "Final play"];
  const order = { r1:0, huddle:0.5, r2:1, r2fb:1.5, final:2, thanks:3 };
  const at = order[screen];
  $("#downs").innerHTML = at === undefined ? "" : steps.map((s, i) =>
    `<span class="${(at >= i && at < i + 1) ? "on" : at > i ? "done" : ""}">${s}</span>`).join("");
}
function go(s){ screen = s; clearTimeout(homeTimer); render(); downs(); window.scrollTo(0, 0); }

function cardsHTML(round, pick){
  const R = round === "r1" ? ROUND1 : ROUND2;
  return `<div class="cards">${game.order[round].map((o, i) => {
    let cls = "";
    if (pick) cls = o.id === R.correct ? "right" : (o.id === pick ? "wrong" : "");
    return `<button class="play ${cls}" data-pick="${o.id}" ${pick ? "disabled" : ""}>
      <span class="tag">${"ABC"[i]} · Play call</span>${diagram(o.d)}
      <strong>${esc(o.title)}</strong><small>${esc(o.sub)}</small></button>`;
  }).join("")}</div>`;
}

function render(){
  const el = $("#screen");
  if (screen === "start") {
    el.innerHTML = `<section class="start fade">
      <div style="display:flex;flex-direction:column;gap:20px">
        <span class="eyebrow">${esc(cfg.event)}</span>
        <h1>Want to make <em>the team?</em></h1>
        <p class="scenario">Two quick plays and you get a prize.</p>
        <div class="row"><button class="btn" id="play">Tap to play</button></div>
      </div>
      <svg viewBox="0 0 300 260" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <circle cx="60" cy="200" r="16"/><circle cx="150" cy="215" r="16"/><circle cx="240" cy="200" r="16"/>
          <path d="M138 50 l24 24 m0 -24 l-24 24"/>
          <path d="M70 184 Q 90 110 135 78" stroke-dasharray="2 9"/><path d="M150 198 L150 92"/><path d="M230 184 Q 210 110 165 78" stroke-dasharray="2 9"/>
        </g>
        <text x="150" y="250" text-anchor="middle" font-family="Noteworthy, 'Marker Felt', cursive" font-size="20" fill="currentColor">nobody plays alone</text>
      </svg>
    </section>
    <div class="foot"><span>Baylor University Counseling Center outreach</span>
      <button class="hold" id="staffBtn" aria-label="Staff results, press and hold to open"><i></i>Staff · hold</button></div>`;
    $("#play").onclick = () => {
      game = { id: null, pre: null, post: null, order: { r1: shuffle(ROUND1.options), r2: shuffle(ROUND2.options) } };
      go("r1");
    };
    wireHold($("#staffBtn"));
  }
  else if (screen === "r1") {
    el.innerHTML = `<section class="fade" style="display:flex;flex-direction:column;gap:22px">
      <span class="eyebrow">Play 1</span>
      <p class="scenario">${ROUND1.scenario}</p>
      <h2>What's your play?</h2>${cardsHTML("r1")}</section>`;
    el.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { game.pre = b.dataset.pick; go("huddle"); });
  }
  else if (screen === "huddle") {
    el.innerHTML = `<section class="fade" style="display:flex;flex-direction:column;gap:26px">
      <span class="eyebrow">Play called · huddle up</span>
      <h2>Here's what the playbook says</h2>
      <div class="huddle">
        <div><b>It doesn't always look sad</b><span>For a lot of guys, struggling shows up as irritability, pulling away, or partying harder.</span></div>
        <div><b>Ask directly</b><span>A real “Are you actually okay?” doesn't make things worse. It opens the door.</span></div>
        <div><b>Pass the ball</b><span>You're the teammate, not the therapist. Your job is to connect him to ${esc(cfg.where)}.</span></div>
      </div>
      <div class="row"><button class="btn" id="next">Ready for play 2</button></div></section>`;
    $("#next").onclick = () => go("r2");
  }
  else if (screen === "r2" || screen === "r2fb") {
    const fb = screen === "r2fb", right = game.post === ROUND2.correct;
    el.innerHTML = `<section class="fade" style="display:flex;flex-direction:column;gap:22px">
      <span class="eyebrow">Play 2</span>
      <p class="scenario">${ROUND2.scenario}</p>
      ${fb ? `<div class="feedback ${right ? "good" : "miss"}"><strong>${right ? "That's a team player." : "Close. Here's the best play."}</strong>
        Leaning in and offering to go together makes it easy for him to say yes.</div>` : `<h2>What's your play?</h2>`}
      ${cardsHTML("r2", fb ? game.post : null)}
      ${fb ? `<div class="row"><button class="btn" id="next">One more play</button></div>` : ""}</section>`;
    if (!fb) el.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { game.post = b.dataset.pick; saveGame(); go("r2fb"); });
    else $("#next").onclick = () => go("final");
  }
  else if (screen === "final") {
    el.innerHTML = `<section class="fade" style="display:flex;flex-direction:column;gap:22px">
      <div class="final">
        <div style="display:flex;flex-direction:column;gap:16px">
          <span class="eyebrow">Final play</span>
          <h2>Put the team on your bench</h2>
          <p class="scenario">Scan the code to save the Counseling Center and crisis lines to your phone. Show the saved contact to grab your prize.</p>
          <p class="crisis">In a crisis anytime: <b>call or text 988</b>.</p>
        </div>
        <div class="qr ${cfg.qr ? "" : "empty"}">${cfg.qr ? `<img src="${esc(cfg.qr)}" alt="QR code that saves the Counseling Center contact">` : "Scan the QR card on the table"}</div>
      </div>
      <div class="staffbar"><span class="lbl">Staff: contact saved?</span>
        <button class="btn small" id="yes">Saved ✓</button>
        <button class="btn small ghost" id="no">Skipped</button></div></section>`;
    $("#yes").onclick = () => { markSaved(true); go("thanks"); };
    $("#no").onclick = () => { markSaved(false); go("thanks"); };
  }
  else if (screen === "thanks") {
    el.innerHTML = `<section class="fade" style="display:flex;flex-direction:column;gap:22px;align-items:flex-start">
      <span class="eyebrow">Game over</span><h1>Thanks for<br>making the team.</h1>
      <p class="scenario hand">Grab your prize, and check in on somebody this week.</p>
      <button class="btn" id="next">Next player</button></section>`;
    $("#next").onclick = () => go("start");
    homeTimer = setTimeout(() => go("start"), 8000);
  }
  else if (screen === "staff") renderStaff(el);
}

function wireHold(btn){
  let t = null;
  const start = e => { e.preventDefault(); btn.classList.add("pressing"); t = setTimeout(() => { btn.classList.remove("pressing"); confirm = ""; go("staff"); }, 1000); };
  const stop = () => { btn.classList.remove("pressing"); clearTimeout(t); };
  btn.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("contextmenu", e => e.preventDefault());
  btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { confirm = ""; go("staff"); } });
}

/* ---------- saving on this device ---------- */
function saveGame(){
  game.id = newId();
  plays.unshift({ id: game.id, event: cfg.event, at: new Date().toISOString(),
    preChoice: game.pre, pre: game.pre === ROUND1.correct,
    postChoice: game.post, post: game.post === ROUND2.correct, saved: null });
  savePlays();
}
function markSaved(v){
  const p = plays.find(x => x.id === game?.id); if (!p) return;
  p.saved = v; savePlays();
}

/* ---------- staff ---------- */
function summarize(rows){
  return { n: rows.length, pre: rows.filter(r => r.pre).length, post: rows.filter(r => r.post).length,
    saved: rows.filter(r => r.saved === true).length, gained: rows.filter(r => !r.pre && r.post).length };
}
function toCSV(rows){
  const head = "event,date_time,pre_choice,pre_correct,post_choice,post_correct,saved_contact";
  const lines = rows.slice().reverse().map(p => [p.event, p.at, p.preChoice, p.pre, p.postChoice, p.post, p.saved === null ? "" : p.saved]
    .map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
  return [head, ...lines].join("\n");
}
async function exportCSV(){
  const csv = toCSV(plays);
  const name = `takes-a-team-results-${new Date().toISOString().slice(0, 10)}.csv`;
  const markDone = () => { cfg.lastExport = new Date().toISOString(); saveCfg(); render(); };
  try {
    const file = new File([csv], name, { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Takes a Team results" });
      markDone(); toast("Results exported"); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markDone(); toast("Results downloaded");
  } catch (e) { $("#csvBox").hidden = false; toast("Copy the results from the box below"); }
}

function renderStaff(el){
  const rows = plays.filter(p => p.event === cfg.event);
  const s = summarize(rows);
  const events = [...new Set(plays.map(p => p.event))];
  const statement = s.n
    ? `At ${cfg.event} tabling, ${s.n} students played. ${pct(s.pre, s.n)}% chose to check in directly before the huddle; ${pct(s.post, s.n)}% chose to lean in and refer after. ${pct(s.saved, s.n)}% saved crisis and counseling contacts to their phone.`
    : "";
  const unexported = plays.filter(p => !cfg.lastExport || p.at > cfg.lastExport).length;
  el.innerHTML = `<section class="panel fade">
    <div class="row" style="justify-content:space-between">
      <div><span class="eyebrow">Staff results · saved on this iPad only</span><h2>${esc(cfg.event)}</h2></div>
      <button class="btn small" id="back">Back to game</button>
    </div>
    ${!storageOK ? `<div class="notice">This browser is blocking storage (often Private Browsing). Plays will be lost when the page closes. Turn off Private Browsing and reopen the game.</div>` : ""}
    ${plays.length ? `<div class="${unexported ? "notice" : "okline"}">${unexported
      ? `${unexported} play${unexported === 1 ? "" : "s"} not exported yet. Export after every event so nothing is lost if the iPad's browser data is cleared.`
      : `All plays exported${cfg.lastExport ? " · last export " + esc(fmtDate(cfg.lastExport)) : ""}.`}</div>` : ""}
    ${s.n ? `
    <div class="stats">
      <div class="stat"><div class="n">${s.n}</div><div class="l">Students played</div></div>
      <div class="stat"><div class="n">${pct(s.pre, s.n)}%</div><div class="l">Knew the play before</div></div>
      <div class="stat gold"><div class="n">${pct(s.post, s.n)}%</div><div class="l">Made the play after</div></div>
      <div class="stat"><div class="n">${pct(s.saved, s.n)}%</div><div class="l">Saved the contact</div></div>
    </div>
    <div class="bars" aria-label="Before and after comparison">
      <div class="bar"><span>Before huddle</span><div class="track"><div class="fill" style="width:${pct(s.pre, s.n)}%"></div></div><span class="v">${s.pre}/${s.n}</span></div>
      <div class="bar"><span>After huddle</span><div class="track"><div class="fill post" style="width:${pct(s.post, s.n)}%"></div></div><span class="v">${s.post}/${s.n}</span></div>
      <div class="bar"><span>Saved contact</span><div class="track"><div class="fill saved" style="width:${pct(s.saved, s.n)}%"></div></div><span class="v">${s.saved}/${s.n}</span></div>
    </div>
    <p class="muted" style="margin:0">${s.gained} student${s.gained === 1 ? "" : "s"} missed play 1 and made play 2.</p>
    <div class="sec"><h3>Impact statement</h3><div class="statement">${esc(statement)}</div></div>`
    : `<p class="scenario muted">No plays yet for this event. Each finished game adds a row: what the student picked before the huddle, after it, and whether they saved the contact.</p>`}
    <div class="sec"><h3>Results</h3>
      <div class="row">
        <button class="btn small" id="export" ${plays.length ? "" : "disabled"}>Export results (CSV)</button>
        <button class="btn small ghost" id="undo" ${rows.length ? "" : "disabled"}>${confirm === "undo" ? "Tap again to delete last play" : "Undo last play"}</button>
        <button class="btn small warn" id="clear" ${plays.length ? "" : "disabled"}>${confirm === "clear" ? "Tap again to erase all results" : "Erase all results"}</button>
      </div>
      <textarea class="csv" id="csvBox" readonly hidden>${esc(toCSV(plays))}</textarea>
    </div>
    <div class="sec"><h3>Event setup</h3>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="evName">Event name (results are grouped by this)</label><input type="text" id="evName" value="${esc(cfg.event)}"></div>
        <div class="field"><label for="where">Huddle point 3 ends with “connect him to …”</label><input type="text" id="where" value="${esc(cfg.where)}"></div>
        <div class="row"><button class="btn small" id="saveCfg">Save setup</button></div>
        <div class="field"><label for="qrFile">vCard QR image for the final play ${cfg.qr ? "(added)" : "(not added yet)"}</label>
          <input type="file" id="qrFile" accept="image/*"></div>
        ${cfg.qr ? `<div class="row"><img src="${esc(cfg.qr)}" alt="Current QR image" style="width:90px;height:90px;background:#fff;border-radius:4px;padding:4px"><button class="btn small ghost" id="rmQr">Remove QR image</button></div>` : ""}
      </div></div>
    ${events.length ? `<div class="sec"><h3>All events on this iPad</h3><div class="tablewrap"><table>
      <thead><tr><th>Event</th><th>Played</th><th>Before</th><th>After</th><th>Saved</th></tr></thead><tbody>
      ${events.map(ev => { const t = summarize(plays.filter(p => p.event === ev));
        return `<tr><td>${esc(ev)}</td><td>${t.n}</td><td>${pct(t.pre, t.n)}%</td><td>${pct(t.post, t.n)}%</td><td>${pct(t.saved, t.n)}%</td></tr>`; }).join("")}
      </tbody></table></div></div>` : ""}
  </section>`;
  $("#back").onclick = () => { confirm = ""; go("start"); };
  $("#export").onclick = exportCSV;
  $("#undo").onclick = () => {
    if (confirm !== "undo") { confirm = "undo"; render(); return; }
    confirm = ""; const last = rows[0];
    if (last) { plays = plays.filter(p => p.id !== last.id); savePlays(); toast("Last play deleted"); }
    render();
  };
  $("#clear").onclick = () => {
    if (confirm !== "clear") { confirm = "clear"; render(); return; }
    confirm = ""; plays = []; savePlays(); toast("All results erased"); render();
  };
  $("#saveCfg").onclick = () => {
    cfg.event = $("#evName").value.trim() || DEFAULTS.event;
    cfg.where = $("#where").value.trim() || DEFAULTS.where;
    saveCfg(); toast("Setup saved"); render();
  };
  $("#qrFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const max = 700, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.imageSmoothingEnabled = false; ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      cfg.qr = c.toDataURL("image/png"); saveCfg(); toast("QR image added"); render();
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast("That file isn't an image. Try a PNG or JPG."); };
    img.src = url;
  };
  if ($("#rmQr")) $("#rmQr").onclick = () => { cfg.qr = ""; saveCfg(); render(); };
}

/* ---------- boot ---------- */
go("start");
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
</body>
</html>
