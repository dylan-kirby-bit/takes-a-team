<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Takes a Team">
<meta name="theme-color" content="#103a2a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Takes a Team Playbook</title>
<style>
/* A coach's chalk playbook on turf. Uses only fonts built into iPad/Mac/Windows, so the page makes no outside requests. */
:root{
  --turf:#103a2a; --turf-2:#17483a; --turf-3:#1d5644; --line:rgba(243,241,232,.14);
  --chalk:#f3f1e8; --chalk-dim:#b8c8bd; --gold:#f6bd3a; --gold-ink:#2a1f05;
  --good:#8fdc9a; --miss:#f39a7c;
  --p1:#f6bd3a; --p2:#8fd3e8; --p3:#d2b4f5;
  --display:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --body:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --hand:"Noteworthy","Marker Felt","Comic Sans MS","Bradley Hand",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--turf);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,transparent 0 119px,var(--line) 119px 121px);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
input,textarea{-webkit-user-select:text;user-select:text}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:14px 24px;gap:18px}
.board{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--chalk);padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem}
.brand b{color:var(--gold)}
.downs{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:.9rem;text-transform:uppercase}
.downs span{padding:4px 10px;border:1.5px solid var(--chalk-dim);color:var(--chalk-dim);border-radius:3px}
.downs span.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.downs span.done{color:var(--chalk);border-color:var(--chalk)}
main{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
.stack{display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(3rem,9vw,6.2rem)}
h2{font-size:clamp(2rem,5vw,3.1rem)}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:1rem}
.hand{font-family:var(--hand);color:var(--chalk-dim)}
.scenario{font-size:clamp(1.25rem,2.6vw,1.6rem);max-width:46ch;margin:0;line-height:1.35}
.scenario q{font-family:var(--hand);color:var(--chalk)}
.small{font-size:.9rem;color:var(--chalk-dim);margin:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.play{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:18px;border:2px solid var(--chalk);border-radius:6px;background:var(--turf-2);min-height:220px;transition:transform .15s,background .15s;position:relative}
.play:active{transform:scale(.98);background:var(--turf-3)}
.play:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.play .tag{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.1em;color:var(--gold)}
.play svg{width:100%;height:76px;color:var(--chalk-dim)}
.play strong{font-family:var(--display);font-weight:800;font-size:1.7rem;text-transform:uppercase;line-height:1}
.play small{font-size:1rem;color:var(--chalk-dim);line-height:1.35}
.play.right{border-color:var(--good);background:var(--turf-3)} .play.right .tag{color:var(--good)}
.play.wrong{border-color:var(--miss);opacity:.75}
.play[disabled]{cursor:default}
.pickers{display:flex;gap:6px;flex-wrap:wrap}
.pickers i{font-style:normal;font-family:var(--display);font-weight:800;font-size:.85rem;letter-spacing:.06em;padding:3px 8px;border-radius:3px;color:var(--turf);background:var(--pc)}
.btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:1.35rem;padding:16px 30px;border-radius:4px;background:var(--gold);color:var(--gold-ink);text-align:center}
.btn:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid var(--chalk)}
.btn.warn{background:transparent;color:var(--miss);border:2px solid var(--miss)}
.btn.small{font-size:1rem;padding:10px 18px}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.start{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:760px){.start{grid-template-columns:1fr}}
.start h1 em{font-style:normal;color:var(--gold)}
.start svg{width:100%;max-height:340px;color:var(--chalk)}
.count{display:flex;gap:12px;flex-wrap:wrap}
.count .btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:150px}
.count .btn small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:600;font-size:.85rem;opacity:.85}
/* turn banner for group play */
.turn{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:2px solid var(--pc);border-radius:6px;padding:12px 16px;background:var(--turf-2)}
.turn b{font-family:var(--display);font-size:1.5rem;text-transform:uppercase;color:var(--pc);letter-spacing:.04em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.9rem;padding:5px 10px;border-radius:3px;border:1.5px solid var(--pc);color:var(--pc)}
.chip.done{background:var(--pc);color:var(--turf)}
.pass{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px}
.pass .big{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,7vw,4.6rem);line-height:.95;color:var(--pc)}
/* stat */
.guess{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:720px}
.guess button{appearance:none;-webkit-appearance:none;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,4rem);color:var(--chalk);background:var(--turf-2);border:2px solid var(--chalk);border-radius:6px;padding:22px 0;cursor:pointer}
.guess button:active{background:var(--turf-3)}
.guess button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.statwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}
@media (max-width:760px){.statwrap{grid-template-columns:1fr}}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(5rem,14vw,8.5rem);line-height:.85;color:var(--gold)}
.sbars{display:flex;flex-direction:column;gap:18px}
.sgroup h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:1.2rem;margin:0 0 8px}
.sbar{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:1rem}
.sbar+.sbar{margin-top:6px}
.strack{height:24px;background:var(--turf-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.sfill{height:100%;background:var(--chalk-dim)} .sfill.men{background:var(--gold)}
.sbar .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.callout{font-size:clamp(1.2rem,2.4vw,1.5rem);font-weight:700;margin:0;max-width:40ch}
.huddle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:h}
@media (max-width:760px){.huddle{grid-template-columns:1fr}}
.huddle div{border-top:3px solid var(--gold);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.huddle b{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;line-height:1}
.huddle b::before{counter-increment:h;content:counter(h) ". ";color:var(--gold)}
.feedback{font-size:1.25rem;max-width:56ch;display:flex;flex-direction:column;gap:8px}
.feedback strong{font-family:var(--display);font-size:2rem;text-transform:uppercase;display:block;line-height:1}
.feedback.good strong{color:var(--good)} .feedback.miss strong{color:var(--miss)}
.results{display:flex;gap:8px;flex-wrap:wrap}
/* usefulness */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:900px}
@media (max-width:760px){.opts{grid-template-columns:1fr}}
.opt{appearance:none;-webkit-appearance:none;font:inherit;font-size:1.2rem;font-weight:600;color:var(--chalk);text-align:left;cursor:pointer;background:var(--turf-2);border:2px solid var(--chalk);border-radius:6px;padding:18px 20px;line-height:1.3}
.opt:active{background:var(--turf-3)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* final */
.final{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
@media (max-width:760px){.final{grid-template-columns:1fr}}
.qr{width:min(300px,70vw);aspect-ratio:1;max-width:100%;background:#fff;border-radius:6px;display:grid;place-items:center;padding:14px}
.qr img{width:100%;height:100%;object-fit:contain}
.qr.empty{background:transparent;border:2.5px dashed var(--chalk-dim);color:var(--chalk-dim);text-align:center;font-family:var(--hand);font-size:1.3rem}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roster li{display:flex;align-items:center;gap:12px;font-size:1.2rem;font-weight:600}
.roster li::before{content:"";width:14px;height:14px;border:2.5px solid var(--gold);border-radius:50%;flex:none}
.crisis{font-size:1.05rem;color:var(--chalk-dim);margin:0} .crisis b{color:var(--chalk)}
.staffbar{border-top:1.5px dashed var(--chalk-dim);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.staffbar .lbl{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim);font-size:.95rem}
.savedrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savedrow .who{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pc);min-width:96px}
.tog{appearance:none;-webkit-appearance:none;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;padding:9px 14px;border-radius:4px;border:2px solid var(--chalk-dim);background:transparent;color:var(--chalk-dim);cursor:pointer}
.tog.on{background:var(--chalk);color:var(--turf);border-color:var(--chalk)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--chalk-dim);font-size:.85rem}
.hold{appearance:none;-webkit-appearance:none;background:transparent;color:var(--chalk-dim);cursor:pointer;font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:10px 14px;border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden;-webkit-touch-callout:none}
.hold i{position:absolute;inset:0;background:var(--gold);opacity:.35;transform:scaleX(0);transform-origin:left}
.hold.pressing i{transition:transform 1s linear;transform:scaleX(1)}
/* staff */
.panel{display:flex;flex-direction:column;gap:26px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-left:3px solid var(--chalk-dim);padding-left:12px}
.stat .n{font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.9rem;color:var(--chalk-dim)}
.stat.gold{border-color:var(--gold)} .stat.gold .n{color:var(--gold)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:230px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:.95rem}
@media (max-width:620px){.bar{grid-template-columns:120px minmax(0,1fr) 52px}}
.track{height:22px;background:var(--turf-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--chalk-dim)} .fill.post{background:var(--gold)} .fill.saved{background:var(--good)}
.bar .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.statement{background:var(--turf-2);border:1px solid var(--line);border-radius:4px;padding:16px;font-size:1.1rem;max-width:70ch;-webkit-user-select:text;user-select:text}
.sec h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:1.3rem;margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:6px;max-width:520px}
.field label{font-size:.9rem;color:var(--chalk-dim)}
.field input[type=text]{font:inherit;font-size:16px;color:var(--chalk);background:var(--turf-2);border:1.5px solid var(--chalk-dim);border-radius:4px;padding:10px 12px}
.field input:focus-visible{outline:2px solid var(--gold);border-color:var(--gold)}
textarea.csv{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--chalk);background:var(--turf-2);border:1px solid var(--line);border-radius:4px;padding:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--chalk-dim);font-weight:700}
.notice{border:1.5px solid var(--miss);padding:10px 14px;border-radius:4px;font-size:.95rem}
.okline{border-left:3px solid var(--good);padding-left:12px;font-size:.95rem;color:var(--chalk-dim)}
.muted{color:var(--chalk-dim)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--turf);padding:10px 18px;border-radius:4px;font-weight:600;z-index:5;max-width:calc(100% - 40px)}
[hidden]{display:none!important}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.hold.pressing i{transition:none}.play{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="board">
    <div class="brand">Mental Health <b>Takes a Team</b></div>
    <div class="downs" id="downs" aria-label="Progress"></div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div id="toast" hidden></div>

<script>
(() => {
"use strict";
/* All results stay in this browser's storage on this device. The page sends nothing anywhere. */
const KEY_PLAYS = "takesATeam.plays.v2", KEY_CFG = "takesATeam.config.v1";
const DEFAULTS = { event: "Men's Mental Health Month", where: "the Baylor University Counseling Center", qr: "", lastExport: "" };
const IDLE_MS = 120000;   // an abandoned game returns to the start screen after 2 minutes

function readKey(k, fallback){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function writeKey(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const storageOK = (() => { try { localStorage.setItem("takesATeam.test", "1"); localStorage.removeItem("takesATeam.test"); return true; } catch (e) { return false; } })();

let cfg = { ...DEFAULTS, ...readKey(KEY_CFG, {}) };
let plays = readKey(KEY_PLAYS, []);
let game = null, screen = "start", homeTimer = null, idleTimer = null, confirm = "";

function savePlays(){ if (!writeKey(KEY_PLAYS, plays)) toast("This play couldn't be saved on the iPad. Export results now."); }
function saveCfg(){ if (!writeKey(KEY_CFG, cfg)) toast("Setup couldn't be saved. The QR image may be too large."); }

/* ---------- content ---------- */
const ROUND1 = {
  scenario: "Your roommate's been skipping class and the gym, snapping at everybody, and when you ask, they say they're <q>fine.</q>",
  correct: "checkin",
  options: [
    { id: "space",   title: "Give them space", sub: "They'll come to you when they're ready.", d: "space" },
    { id: "checkin", title: "Check in directly", sub: "Ask for real: “Hey, are you actually okay?”", d: "in" },
    { id: "joke",    title: "Crack a joke", sub: "Lighten the mood and move on.", d: "around" }
  ]
};
const ROUND2 = {
  scenario: "Your friend says, <q>I've been in a weird place lately, but I don't want to make it a thing.</q>",
  correct: "lean",
  options: [
    { id: "change", title: "Change the subject", sub: "Keep it light so they're comfortable.", d: "away" },
    { id: "lean",   title: "Lean in and go together", sub: "“Thanks for telling me. Want to grab food and talk? I'll walk over to the Counseling Center with you.”", d: "pass" },
    { id: "shrug",  title: "Tell them it's normal", sub: "“Everybody gets stressed. You'll be fine.”", d: "space" }
  ]
};
const STAT = { answer: 38, choices: [18, 38, 58] };
const USEFUL = [
  { id: "learned_will_use",  text: "I learned something new, and I'll use it." },
  { id: "learned_wont_use",  text: "I learned something new, but I probably won't use it." },
  { id: "good_reminder",     text: "I didn't learn anything new, but it was a good reminder." },
  { id: "nothing_new",       text: "I didn't learn anything new, and I won't use it." }
];
const ROSTER = ["Baylor Counseling Center Office", "Suicide Prevention Hotline (988)", "Heart of Texas Behavioral Network", "Baylor Police"];
const PCOLORS = ["var(--p1)", "var(--p2)", "var(--p3)"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => { t.hidden = true; }, 2600); }
function fmtDate(iso){ try { return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch (e) { return iso; } }
const group = () => game && game.size > 1;
const pname = i => `Player ${i + 1}`;

function diagram(kind){
  const O = (x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>`;
  const X = (x,y)=>`<path d="M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}" stroke="currentColor" stroke-width="2.5" fill="none"/>`;
  const arrow = d => `<path d="${d}" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#ah-${kind})"/>`;
  const defs = `<defs><marker id="ah-${kind}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>`;
  const parts = {
    space:  O(40,40)+X(200,40)+arrow("M55 52 Q 70 70 40 72"),
    in:     O(40,40)+X(200,40)+arrow("M55 40 L 180 40"),
    around: O(40,40)+X(200,40)+arrow("M52 30 Q 120 -6 188 26 Q 210 50 170 64"),
    away:   O(40,40)+X(200,40)+arrow("M55 46 Q 100 74 40 70"),
    pass:   O(40,40)+X(140,40)+`<rect x="208" y="26" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5"/>`+arrow("M55 40 L 122 40")+arrow("M156 40 L 202 40")
  };
  return `<svg viewBox="0 0 250 80" aria-hidden="true">${defs}${parts[kind]}</svg>`;
}

/* ---------- navigation ---------- */
function downs(){
  const steps = ["Play 1", "Huddle", "Play 2", "Wrap-up"];
  const order = { r1:0, pass1:0, stat:1, statReveal:1, huddle:1, r2:2, pass2:2, r2fb:2, useful:3, final:3, thanks:4 };
  const at = order[screen];
  $("#downs").innerHTML = at === undefined ? "" : steps.map((s, i) =>
    `<span class="${at === i ? "on" : at > i ? "done" : ""}">${s}</span>`).join("");
}
function go(s){ screen = s; clearTimeout(homeTimer); render(); downs(); window.scrollTo(0, 0); bumpIdle(); }
function bumpIdle(){
  clearTimeout(idleTimer);
  if (["start", "staff", "thanks"].includes(screen)) return;
  idleTimer = setTimeout(() => { game = null; go("start"); }, IDLE_MS);
}
document.addEventListener("pointerdown", bumpIdle, { passive: true });

function newGame(size){
  game = { id: newId(), size, turn: 0, guess: null, rowIds: [],
    players: Array.from({ length: size }, () => ({ pre: null, post: null, useful: null, saved: null })),
    order: { r1: shuffle(ROUND1.options), r2: shuffle(ROUND2.options) } };
}

function turnBanner(field, verb){
  if (!group()) return "";
  const i = game.turn;
  return `<div class="turn" style="--pc:${PCOLORS[i]}"><b>${pname(i)}, ${verb}</b>
    <div class="chips">${game.players.map((p, j) =>
      `<span class="chip ${p[field] ? "done" : ""}" style="--pc:${PCOLORS[j]}">${pname(j)}${p[field] ? " ✓" : ""}</span>`).join("")}</div></div>`;
}

function cardsHTML(round, reveal){
  const R = round === "r1" ? ROUND1 : ROUND2;
  const field = round === "r1" ? "pre" : "post";
  return `<div class="cards">${game.order[round].map((o, i) => {
    let cls = "", pickers = "";
    if (reveal) {
      const who = game.players.map((p, j) => p[field] === o.id ? j : -1).filter(j => j >= 0);
      cls = o.id === R.correct ? "right" : (who.length ? "wrong" : "");
      if (group() && who.length) pickers = `<span class="pickers">${who.map(j => `<i style="--pc:${PCOLORS[j]}">${pname(j)}</i>`).join("")}</span>`;
    }
    return `<button class="play ${cls}" data-pick="${o.id}" ${reveal ? "disabled" : ""}>
      <span class="tag">${"ABC"[i]} · Play call</span>${diagram(o.d)}
      <strong>${esc(o.title)}</strong><small>${esc(o.sub)}</small>${pickers}</button>`;
  }).join("")}</div>`;
}

/* Record a pick for the current player, then hand off or move on. */
function pick(field, value, passScreen, nextScreen, after){
  game.players[game.turn][field] = value;
  if (group() && game.turn < game.size - 1) { game.turn++; go(passScreen); return; }
  game.turn = 0;
  if (after) after();
  go(nextScreen);
}

function wireHold(btn){
  let t = null;
  const start = e => { e.preventDefault(); btn.classList.add("pressing"); t = setTimeout(() => { btn.classList.remove("pressing"); confirm = ""; go("staff"); }, 1000); };
  const stop = () => { btn.classList.remove("pressing"); clearTimeout(t); };
  btn.addEventListener("pointerdown", start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("contextmenu", e => e.preventDefault());
  btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { confirm = ""; go("staff"); } });
}

/* ---------- saving on this device: one row per player ---------- */
function saveGame(){
  const at = new Date().toISOString();
  const rows = game.players.map((p, i) => ({
    id: newId(), gameId: game.id, groupSize: game.size, player: i + 1, event: cfg.event, at,
    preChoice: p.pre, pre: p.pre === ROUND1.correct,
    statGuess: game.guess, statCorrect: game.guess === STAT.answer,
    postChoice: p.post, post: p.post === ROUND2.correct,
    useful: null, saved: null }));
  game.rowIds = rows.map(r => r.id);
  plays = [...rows.slice().reverse(), ...plays];
  savePlays();
}
function updateRow(i, patch){
  const id = game?.rowIds?.[i]; if (!id) return;
  const r = plays.find(x => x.id === id); if (!r) return;
  Object.assign(r, patch); savePlays();
}

/* ---------- staff ---------- */
function summarize(rows){
  const answered = rows.filter(r => r.useful);
  return { n: rows.length, games: new Set(rows.map(r => r.gameId)).size,
    friends: rows.filter(r => r.groupSize > 1).length,
    pre: rows.filter(r => r.pre).length, post: rows.filter(r => r.post).length,
    saved: rows.filter(r => r.saved === true).length, gained: rows.filter(r => !r.pre && r.post).length,
    statRight: rows.filter(r => r.statCorrect).length,
    usefulN: answered.length,
    useful: Object.fromEntries(USEFUL.map(u => [u.id, answered.filter(r => r.useful === u.id).length])) };
}
function toCSV(rows){
  const head = "event,date_time,game_id,group_size,player,pre_choice,pre_correct,stat_guess,stat_correct,post_choice,post_correct,usefulness,saved_contact";
  const lines = rows.slice().reverse().map(p => [p.event, p.at, p.gameId, p.groupSize, p.player, p.preChoice, p.pre, p.statGuess, p.statCorrect,
    p.postChoice, p.post, p.useful ?? "", p.saved === null ? "" : p.saved]
    .map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
  return [head, ...lines].join("\n");
}
async function exportCSV(){
  const csv = toCSV(plays);
  const name = `takes-a-team-results-${new Date().toISOString().slice(0, 10)}.csv`;
  const markDone = () => { cfg.lastExport = new Date().toISOString(); saveCfg(); render(); };
  try {
    const file = new File([csv], name, { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Takes a Team results" });
      markDone(); toast("Results exported"); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markDone(); toast("Results downloaded");
  } catch (e) { $("#csvBox").hidden = false; toast("Copy the results from the box below"); }
}

    : `<p class="scenario muted">No plays yet for this event. Each finished game adds one row per player: their picks before and after the huddle, their stat guess, how useful it was, and whether they saved the contact.</p>`}

    if (confirm !== "clear") { confirm = "clear"; render(); return; }
    confirm = ""; plays = []; savePlays(); toast("All results erased"); render();
  };
  $("#saveCfg").onclick = () => {

      const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);

      cfg.qr = c.toDataURL("image/png"); saveCfg(); toast("QR image added"); render();
